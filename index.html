<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moogle 🐮</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="#" class="logo">🐮 moogle<span>.</span></a>
    <button id="themeToggle">☾</button>
</header>

<main>
    <section class="hero">

        <div class="cow">🐄</div>

        <p class="eyebrow">A little pasture on the internet</p>

        <h1>Where would you like<br>to <span>moo</span>ve today?</h1>

        <p class="subtitle">
            Pop in a website address and off you go!
        </p>

        <div class="browse-box">
            <form id="urlForm">
                <span>🌐</span>
                <input id="urlInput" placeholder="example.com" autocomplete="url">
                <button type="submit">Go ↗</button>
            </form>
        </div>

        <div class="quick-links">
            <a href="https://www.wikipedia.org/" target="_blank">📚 Wikipedia</a>
            <a href="https://www.youtube.com/" target="_blank">▶️ YouTube</a>
            <a href="https://www.reddit.com/" target="_blank">💬 Reddit</a>
            <a href="https://www.google.com/maps" target="_blank">🗺️ Maps</a>
        </div>

    </section>

    <!-- DRAGON CHATS ADVERTISEMENT -->
    <a class="advertisement"
       href="https://dragon-chats.onrender.com"
       target="_blank"
       rel="noopener noreferrer">

        <span class="ad-dragon">🐉</span>

        <div class="ad-text">
            <strong>Visit Dragon Chats</strong>
            <small>Chat with dragons and explore Pyrrhia!</small>
        </div>

        <span class="ad-arrow">↗</span>

    </a>

    <footer>
        <span>Made with ☘️ and a whole lot of moo.</span>
        <span>© 2026 Moogle</span>
    </footer>

</main>

<script src="script.js"></script>
</body>
</html>
</html>
